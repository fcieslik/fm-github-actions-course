name: Frontend Check
description: Frontend check action for GitHub Actions

inputs:
  node-version:
    description: Node.js version (e.g. `22.22`) to use for the build.
    required: false
    default: "22.22"

runs:
  using: "composite"
  steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: "npm"
    - run: npm ci
      shell: bash
    - run: npm run typecheck
      shell: bash
    - name: Check formatting
      run: npm run check
      shell: bash
