name: CI

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - ".agents/**"

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/_build.yml
    with:
      node-version: "22"
      artifact-name: "build"
