name: Deploy

env:
  NODE_VERSION: 22
  ARTIFACT_NAME: build
  BUILD_DIR: build/client

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/_build.yml
    with:
      node-version: "22"
      artifact-name: "build"

  deploy:
    environment: production
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.BUILD_DIR }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::427047664719:role/GitHubActionsDeployRole
          aws-region: eu-central-1
      - run: aws s3 sync ${{ env.BUILD_DIR }}/ s3://fm-github-actions-course/ --delete
