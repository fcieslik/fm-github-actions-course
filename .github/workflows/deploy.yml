name: Deploy

env:
  NODE_VERSION: 22

on:
  push:
    branches: [main]
  pull_request:
    branches:
      - main
    paths-ignore:
      - ".github/workflows/deploy.yml"
      - "docs/**"
      - ".agents/**"
  workflow_dispatch:

jobs:
  pre-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci
      - run: npm run typecheck
      - name: Check formatting
        run: npm run check

  build:
    needs: pre-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: build
          path: build/
