name: Deploy

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  NODE_VERSION: 22
  ARTIFACT_NAME: build
  BUILD_DIR: build/client

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  build:
    uses: ./.github/workflows/_build.yml
    with:
      node-version: "22"
      artifact-name: "build"

  deploy:
    environment: production
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.BUILD_DIR }}
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
        with:
          role-to-assume: arn:aws:iam::427047664719:role/GitHubActionsDeployRole
          aws-region: eu-central-1
      - run: aws s3 sync ${{ env.BUILD_DIR }}/ s3://fm-github-actions-course/ --delete
