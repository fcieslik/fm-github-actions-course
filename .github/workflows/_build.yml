name: Build (reusable)

on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version (e.g. `22.22`) to use for the build.
        required: false
        default: "22.22"
        type: string
      artifact-name:
        description: Name of the uploaded artifact.
        required: false
        default: dist
        type: string
    outputs:
      artifact-name:
        description: Name of the artifact produced by the build job.
        value: ${{ jobs.build.outputs.artifact-name }}

jobs:
  pre-check:
    runs-on: ubuntu-latest
    steps:
      - name: Frontend basic checks
        uses: ./.github/actions/fe-check
        with:
          node-version: ${{ env.NODE_VERSION }}

  build:
    needs: pre-check
    runs-on: ubuntu-latest
    steps:
      - name: Build react app
        uses: ./.github/actions/build-react
        with:
          node-version: ${{ env.NODE_VERSION }}
          artifact-name: ${{ env.ARTIFACT_NAME }}
      - name: Echo artifact name
        id: echo
        run: echo "name=${{ inputs.artifact-name }}" >> "$GITHUB_OUTPUT"
